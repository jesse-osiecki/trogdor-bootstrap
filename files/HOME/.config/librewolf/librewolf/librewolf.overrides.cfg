// LibreWolf per-user overrides. Loaded by /usr/lib/librewolf/librewolf.cfg
// (via autoadmin.global_config_url) after LibreWolf's own defaults, with
// full autoconfig privileges.
//
// Boots mobile-config-firefox on top of librewolf.cfg instead of replacing it.
// Needs: mobile-config-firefox installed (ships /usr/lib/mobile-config-firefox)
// and mobile-config-firefox-librewolf NOT installed -- its
// defaults/pref/mobile-config-prefs.js repoints general.config.filename and
// stops librewolf.cfg (and therefore this file) from loading at all.
// Story and test tool: ~/code/trogdor-support/librewolf/README.md

// The two prefs mobile-config-prefs.js would have set
defaultPref("browser.uidensity", 2);
defaultPref("media.webrtc.camera.allow-pipewire", true);

// Mobile user agent. resistFingerprinting (RFP, on in librewolf.cfg) forces a
// desktop UA in both the HTTP header and navigator.userAgent and ignores
// general.useragent.override, so sites never see mobile-config's "Mobile;" UA.
// RFP is all-or-nothing; fingerprintingProtection (FPP) is the same machinery
// with a per-target list. Run FPP with every target except the two UA ones:
// the mobile UA gets through, the rest (timezone, hardwareConcurrency, canvas,
// window size rounding, ...) stays spoofed. Measured with ua-test.sh.
// Side effect: the "Enable ResistFingerprinting" box in LibreWolf's settings
// shows unchecked; ticking it brings the desktop UA back.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("privacy.fingerprintingProtection.overrides",
            "+AllTargets,-NavigatorUserAgent,-HttpUserAgent");

// Same bootstrap as mobile-config-autoconfig.js
try {
  const { FileUtils } = ChromeUtils.importESModule(
    "resource://gre/modules/FileUtils.sys.mjs"
  );
  const chromeManifest =
    new FileUtils.File("/usr/lib/mobile-config-firefox/chrome.manifest");

  if (chromeManifest.exists()) {
    // boot.sys.mjs is startup-cached; drop the cache so package upgrades apply
    Services.appinfo.invalidateCachesOnRestart();
    Components.manager
      .QueryInterface(Components.interfaces.nsIComponentRegistrar)
      .autoRegister(chromeManifest);
    ChromeUtils.importESModule(
      "chrome://mobileconfigfirefox/content/boot.sys.mjs"
    );
  }
} catch (e) {
  Components.utils.reportError(`Mobile Config Firefox (overrides): ${e}`);
}
