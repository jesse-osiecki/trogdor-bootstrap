---
- name: Packages every device gets
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apk.yml"
  vars:
    apk_packages: [bash, keyd, cros-keyboard-map, libcamera-tools, pipewire-tools, librewolf, mobile-config-firefox]

- name: Managed files (sleep LED hook, sysctl, accel udev rule, libcamera tuning, LibreWolf overrides, battery charge limit, Syncthing nftables rule)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/managed_files.yml"
  vars: { role_name: base }

# LibreWolf: the stub package mobile-config-firefox-librewolf points
# general.config.filename at its own autoconfig, which stops librewolf.cfg (the
# privacy defaults) from loading. The managed librewolf.overrides.cfg boots
# mobile-config-firefox from inside librewolf.cfg instead, so the stub must stay
# away. See README "What each fix does".
- name: "LibreWolf: is the mobile-config stub package installed"
  ansible.builtin.command: apk info -e mobile-config-firefox-librewolf
  register: mcf_stub
  changed_when: false
  failed_when: false
  check_mode: false

- name: "LibreWolf: remove the stub that replaces librewolf.cfg"
  ansible.builtin.command: apk del mobile-config-firefox-librewolf
  when: mcf_stub.rc == 0

# keyd: cros-keyboard-map matches k:18d1:5057, which is both the Hammer keyboard
# and its touchpad, so keyd grabs the touchpad and the cursor jumps to the finger.
# Narrow the match to the keyboard's device hash. See README "What each fix does".
- name: keyd matches only the Hammer keyboard, not the touchpad
  ansible.builtin.lineinfile:
    path: /etc/keyd/default.conf
    regexp: '^k:18d1:5057(:[0-9a-f]+)?\s*$'
    line: "k:18d1:5057:{{ keyd_keyboard_hash }}"
    backup: true
  notify: reload keyd

# keyd: the generic k:0000:0000 entry (meant for the EC matrix keyboard on
# clamshells) also matches cros_ec_buttons on detachables. keyd's grab then swallows
# the lid switch (SW_LID) and the tablet never sleeps on cover close. Exclusions are
# written without the k: prefix and must come BEFORE the include (first match wins).
- name: keyd does not grab the EC buttons/lid-switch device
  ansible.builtin.lineinfile:
    path: /etc/keyd/default.conf
    regexp: '^-0000:0000:[0-9a-f]+\s*$'
    line: "-0000:0000:{{ keyd_ec_buttons_hash }}"
    insertbefore: '^k:0000:0000\s*$'
    backup: true
  notify: reload keyd

- name: zram swap at {{ zram_swap_pct }}% of RAM
  ansible.builtin.lineinfile:
    path: /etc/deviceinfo
    regexp: '^deviceinfo_zram_swap_pct='
    line: 'deviceinfo_zram_swap_pct="{{ zram_swap_pct }}"'

# Battery charge limit: the kernel driver (patches 0029-0030) resets the EC to "no limit"
# on every probe and PowerDevil only reads/writes sysfs, so a oneshot service applies the
# saved value at boot (and when udev sees the battery) and saves the current one at shutdown.
# The variable only seeds the file (force: false): afterwards Plasma's GUI owns the value,
# like firmware would. See README "What each fix does".
- name: Battery charge limit default {{ battery_charge_limit }}% (100 = off; seeds the file once)
  ansible.builtin.copy:
    dest: /etc/battery-charge-limit.conf
    content: "LIMIT={{ battery_charge_limit }}\n"
    mode: "0644"
    force: false
  notify: apply battery charge limit

- name: battery-charge-limit.service enabled
  ansible.builtin.systemd:
    name: battery-charge-limit.service
    enabled: true
    daemon_reload: true

# Firewall: pmOS's nftables (input policy drop, drop-ins in /etc/nftables.d) is the only
# firewall. ufw is an iptables front end; on Alpine that runs through iptables-nft, so with
# both installed every packet crosses two unrelated rule sets. See README "What each fix does".
- name: "Firewall: are ufw or iptables installed"
  ansible.builtin.command: apk info -e ufw iptables
  register: ufw_pkgs
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Firewall: remove ufw and iptables, nftables is the only firewall"
  ansible.builtin.command: apk del {{ ufw_pkgs.stdout_lines | join(' ') }}
  when: ufw_pkgs.stdout_lines | length > 0
  notify: reload nftables

- name: "Firewall: nftables.service enabled"
  ansible.builtin.systemd:
    name: nftables.service
    enabled: true

# sshd: pmbootstrap enables it and postmarketos-config-nftables ships the allow rule as a
# symlink into /usr/share/nftables.avail (openssh-nftrules). Both follow sshd_enabled. apk may
# recreate the symlink on a postmarketos-config-nftables upgrade; check.sh step 2 reports that.
- name: "sshd: unit {{ 'enabled' if sshd_enabled else 'disabled' }}"
  ansible.builtin.systemd:
    name: sshd.service
    enabled: "{{ sshd_enabled | bool }}"
    state: "{{ 'started' if sshd_enabled else 'stopped' }}"

- name: "sshd: nftables allow rule {{ 'present' if sshd_enabled else 'absent' }}"
  ansible.builtin.file:
    path: /etc/nftables.d/50_sshd.nft
    src: "{{ '../../usr/share/nftables.avail/50_sshd.nft' if sshd_enabled else omit }}"
    state: "{{ 'link' if sshd_enabled else 'absent' }}"
  notify: reload nftables

- name: "Syncthing: package"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/apk.yml"
  vars:
    apk_packages: [syncthing]
  when: syncthing_enabled | bool

- name: "Syncthing: syncthing@{{ device_user }} enabled (LAN ports opened by 60_syncthing.nft)"
  ansible.builtin.systemd:
    name: "syncthing@{{ device_user }}.service"
    enabled: true
    state: started
  when: syncthing_enabled | bool

- name: Locally built packages present in apks/
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/apks/{{ item }}"
  loop: "{{ local_apks }}"
  register: apk_files

- name: Which local packages are already installed at this version
  ansible.builtin.shell: >
    apk info -v {{ item.item | regex_replace('-[0-9][^-]*-r[0-9]+\.apk$', '') }}
    | grep -qx {{ item.item | regex_replace('\.apk$', '') }}
  loop: "{{ apk_files.results }}"
  loop_control: { label: "{{ item.item }}" }
  register: apk_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.stat.exists

- name: Install local packages (kernel with camera series, patched qmlkonsole)
  ansible.builtin.command: >
    apk add --allow-untrusted
    {% for r in apk_installed.results if r.item.stat.exists and r.rc != 0 %}{{ playbook_dir }}/apks/{{ r.item.item }} {% endfor %}
  when: apk_installed.results | selectattr('item.stat.exists') | rejectattr('rc', 'equalto', 0) | list | length > 0
