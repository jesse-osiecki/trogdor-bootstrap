# Defaults for every trogdor device. Override per device in inventory/host_vars/<hostname>.yml
# (gitignored; copy inventory/host_vars/example.yml). bootstrap.sh passes device_user as the
# user who runs it; this fallback covers a bare ansible-playbook invocation.
device_user: "{{ lookup('env', 'SUDO_USER') or lookup('env', 'USER') }}"
device_home: "/home/{{ device_user }}"
emmc_device: /dev/mmcblk1
luks_partition: "{{ emmc_device }}p3"

# Which optional roles run. base always runs.
enable_dev: false
enable_unattended: false
enable_face_unlock: false

# --- base ---
# keyd id of the Hammer dock keyboard (NOT the touchpad, which shares 18d1:5057).
# Find it on a new unit with: sudo keyd monitor -t
keyd_keyboard_hash: eb4bc35f
# keyd id of the EC buttons device (cros_ec_buttons: power, volume, lid switch).
# cros-keyboard-map's generic k:0000:0000 matches it, and keyd's grab then swallows
# the SW_LID events, so the tablet never sleeps on cover close. Excluded by hash
# (name-only hash, phys is empty, so it should be the same on every trogdor unit).
keyd_ec_buttons_hash: c68a2d8e
zram_swap_pct: "200"
# Battery charge limit in percent, applied at every boot by battery-charge-limit.service
# (the cros_charge-control driver resets the EC on probe, PowerDevil does not persist it).
# 100 = off. Needs the kernel with patches 0029-0030 (6.18.40-r2+); harmless without it.
battery_charge_limit: 80
# Locally built packages to install from apks/ (empty = skip).
local_apks:
  - linux-postmarketos-qcom-sc7180-6.18.40-r1.apk
  - qmlkonsole-26.04.2-r4.apk
  - qmlkonsole-lang-26.04.2-r4.apk
  # plasma-mobile with the lock screen re-arming Howdy on screen wake (aports/plasma-mobile)
  - plasma-mobile-6.6.6-r1.apk
  - plasma-mobile-lang-6.6.6-r1.apk
  - plasma-mobile-systemd-6.6.6-r1.apk
  # kscreenlocker re-arming finished non-interactive authenticators (aports/kscreenlocker)
  - kscreenlocker-99996.6.6-r2.apk
  - kscreenlocker-lang-99996.6.6-r2.apk

# --- dev ---
# Set both in host_vars (personal; the task is skipped while they are empty).
git_user_name: ""
git_user_email: ""
# abuild's source cache and output repo (sync.sh copies built apks from REPODEST to apks/)
abuild_srcdest: "{{ device_home }}/.cache/abuild/distfiles"
abuild_repodest: "{{ device_home }}/packages"
pipx_tools: [dtschema, b4]

# --- unattended (insecure) ---
# Add a keyfile to the LUKS root so the device boots without a passphrase.
# Needs the current passphrase: run with -e luks_passphrase=... (or set
# LUKS_PASSPHRASE in the environment for bootstrap.sh).
unattended_luks: true

# --- face_unlock ---
howdy_upstream: https://github.com/boltgolt/howdy.git
howdy_src: /opt/howdy/src
howdy_venv: /opt/howdy/venv
dlib_version: "20.0.1"
# PipeWire node of the front camera: wpctl status / pw-cli ls Node
howdy_pipewire_target: libcamera_input._base_soc_0_cci_ac4a000_i2c-bus_0_camera_36
howdy_timeout: 10
howdy_certainty: "3.5"
# HOG detector cutoff; -1.0 still finds a backlit face on the couch (2026-09-13)
howdy_detection_threshold: "-1.0"
# inert while [rubberstamps] enabled = false (nod switched off 2026-09-14)
howdy_nod_rule: "nod		5s		faildeadly   min_distance=8"
