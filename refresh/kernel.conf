# linux-postmarketos-qcom-sc7180 with the wormdingler local patches (camera series, EC charge
# limit; topics and rebase notes in patches/kernel/README.md)
PKG=linux-postmarketos-qcom-sc7180
DESC="camera support and EC charge limit for google-trogdor wormdingler"
UP_REPO=$CODE/pmaports; UP_TRACK=origin/main; UP_PATH=device/community/linux-postmarketos-qcom-sc7180
OUR_BRANCH=wormdingler-camera            # our aport lives on this branch of UP_REPO (name is historical: all topics)
PATCH_MODE=branch
SRC_REPO=$CODE/linux; SRC_BRANCH_FMT='wormdingler-camera-%s'; SRC_TAG_FMT='v%s'
SKIP_IN_UPSTREAM=1                       # drop commits that stable already carries (same subject)
CONFIG_FRAGMENT=$HERE/scripts/kernel-config-fragment
INSERT_ANCHOR='$_config'                 # patch names go before this source= line
TEST=kernel-p4
TAG_SRC_FMT='wormdingler-camera/%s'; TAG_APORT=1
UP_URL=https://gitlab.postmarketos.org/postmarketOS/pmaports.git; UP_CLONE_ARGS='--filter=blob:none'
SRC_URL=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git; SRC_CLONE_ARGS='--depth 1 --branch %s'
REPO_PATCHES=$HERE/patches/kernel/linux-postmarketos-qcom-sc7180   # + ../BASE = pmaports commit
