# qmlkonsole with the stale-framebuffer fixes (Alpine community aport + KDE source clone)
PKG=qmlkonsole
DESC="framebuffer repaint fixes for the 1200x2000 panel"
UP_REPO=$CODE/aports; UP_TRACK=origin/3.24-stable; UP_PATH=community/qmlkonsole
OUR_DIR=$HERE/patches/qmlkonsole        # the aport lives in this repo; abuild builds it in place
PATCH_MODE=branch
SRC_REPO=$CODE/qmlkonsole; SRC_BRANCH=fix/stale-framebuffer; SRC_BASE=origin/master; SRC_TAG_FMT='v%s'
SRC_BRANCH_FMT='fix/stale-framebuffer-%s'   # rebased copy gets a per-version branch
EXTRA_PATCHES="fix-scroll-tracking-latch.patch"   # loose file, kept as-is (parked upstream candidate)
VALIDATE_PREPARE=1
INSTALL_EXTRA=qmlkonsole-lang
TEST='qmlkonsole --version'
UP_URL=https://gitlab.alpinelinux.org/alpine/aports.git; UP_CLONE_ARGS='--depth 1 --filter=blob:none --sparse -b 3.24-stable'
UP_SPARSE='community/qmlkonsole community/plasma-mobile'
SRC_URL=https://invent.kde.org/plasma-mobile/qmlkonsole.git
