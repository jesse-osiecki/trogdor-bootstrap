# plasma-mobile (Alpine community aport) + the lockscreen re-arm-on-wake patch
PKG=plasma-mobile
DESC="re-arm non-interactive auth on screen wake"
UP_REPO=$CODE/aports; UP_TRACK=origin/3.24-stable; UP_PATH=community/plasma-mobile
OUR_DIR=$HERE/aports/plasma-mobile     # the aport lives in this repo; abuild builds it in place
PATCH_MODE=files
VALIDATE_PREPARE=1
TEST=none
UP_URL=https://gitlab.alpinelinux.org/alpine/aports.git; UP_CLONE_ARGS='--depth 1 --filter=blob:none --sparse -b 3.24-stable'
UP_SPARSE='community/qmlkonsole community/plasma-mobile'
